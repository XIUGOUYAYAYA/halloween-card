<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 这一行就是移动端适配关键 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万圣温柔寄语</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background: linear-gradient(160deg, #120420, #2b0f3b, #441828);
  overflow:hidden;
  font-family: "Microsoft Yahei", sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
/* 飘落幽灵 */
.ghost{
  position:absolute;
  width:40px;
  height:50px;
  background:#fefefe;
  border-radius: 50% 50% 40% 40%;
  opacity:0.7;
  animation: float 8s infinite ease-in-out;
}
.ghost::before,.ghost::after{
  content:"";
  position:absolute;
  width:8px;height:8px;
  background:#111;
  border-radius:50%;
  top:14px;
}
.ghost::before{left:8px}
.ghost::after{right:8px}
.ghost .mouth{
  position:absolute;
  width:12px;height:6px;
  border:2px solid #111;
  border-top:none;
  border-radius:0 0 10px 10px;
  left:14px;
  top:28px;
}
@keyframes float{
  0%{transform: translateY(100vh) rotate(-8deg);opacity:0}
  10%{opacity:0.65}
  90%{opacity:0.65}
  100%{transform: translateY(-120px) rotate(8deg);opacity:0}
}
/* 闪烁星星光点 */
.star{
  position:absolute;
  width:4px;height:4px;
  background:#ffdd77;
  border-radius:50%;
  box-shadow:0 0 8px #ffb944;
  animation: twinkle 2.5s infinite alternate;
}
@keyframes twinkle{
  0%{opacity:0.2;transform:scale(0.6)}
  100%{opacity:1;transform:scale(1.2)}
}
/* 南瓜灯 */
.pumpkin-wrap{
  position:relative;
  margin-bottom:clamp(20px,5vw,30px);
}
.pumpkin{
  width:clamp(120px,30vw,160px);
  height:clamp(100px,24vw,130px);
  background:#ff7b26;
  border-radius: 45% 45% 42% 42%;
  position:relative;
  margin:0 auto;
  box-shadow: 0 0 30px #ff6b18, 0 0 60px #ff4c0070;
  animation: pumpBlink 2.2s infinite alternate ease-in-out;
}
@keyframes pumpBlink{
  0%{box-shadow: 0 0 25px #ff6b18, 0 0 45px #ff4c0050}
  100%{box-shadow: 0 0 45px #ff9844, 0 0 80px #ff772288}
}
.pumpkin .stem{
  width:clamp(18px,4vw,22px);
  height:clamp(24px,6vw,30px);
  background:#2d6625;
  border-radius:6px;
  position:absolute;
  top:-24px;
  left:50%;
  transform:translateX(-50%);
}
.pumpkin .eye{
  width:0;
  height:0;
  border-left:clamp(12px,3vw,16px) solid transparent;
  border-right:clamp(12px,3vw,16px) solid transparent;
  border-bottom:clamp(18px,4.5vw,24px) solid #111;
  position:absolute;
  top:clamp(24px,6vw,32px);
}
.eye.left{left:clamp(24px,6vw,32px)}
.eye.right{right:clamp(24px,6vw,32px)}
.pumpkin .mouth{
  width:clamp(54px,14vw,70px);
  height:clamp(24px,6vw,32px);
  border-bottom:clamp(10px,2.5vw,14px) solid #111;
  border-radius:0 0 35px 35px;
  position:absolute;
  bottom:clamp(18px,4.5vw,24px);
  left:50%;
  transform:translateX(-50%);
}
/* 文字卡片 */
.card{
  text-align:center;
  z-index:2;
  padding:20px;
}
.text-line{
  color:#fffbeb;
  font-size:clamp(16px,4vw,22px);
  line-height:2.1;
  text-shadow: 0 0 10px #ffaa4480, 0 0 18px #ff662244;
  opacity:0;
  animation: fadeIn 1.8s forwards;
}
.text-line:nth-child(1){animation-delay:0.4s}
.text-line:nth-child(2){animation-delay:0.9s}
.text-line:nth-child(3){animation-delay:1.4s}
@keyframes fadeIn{
  to{opacity:1}
}
.slogan{
  margin-top:clamp(18px,4vw,24px);
  font-size:clamp(20px,5vw,26px);
  color:#ffddaa;
  letter-spacing:3px;
  text-shadow:0 0 14px #ff8833;
  animation: softPulse 3s infinite alternate;
}
@keyframes softPulse{
  0%{filter: brightness(0.95)}
  100%{filter: brightness(1.2)}
}
</style>
</head>
<body>
<div class="card">
  <div class="pumpkin-wrap">
    <div class="pumpkin">
      <div class="stem"></div>
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </div>
  <div class="text-line">南瓜亮起灯火，鬼怪只是玩笑</div>
  <div class="text-line">想把温柔和甜</div>
  <div class="text-line">悄悄送给你。</div>
  <div class="slogan">🎃 Happy Halloween 🎃</div>
</div>

<script>
// 生成随机幽灵
function createGhost(){
  const g = document.createElement("div");
  g.className="ghost";
  const mouth = document.createElement("div");
  mouth.className="mouth";
  g.appendChild(mouth);
  g.style.left = Math.random()*100 + "%";
  g.style.animationDuration = (6 + Math.random()*6)+"s";
  g.style.animationDelay = Math.random()*4+"s";
  document.body.appendChild(g);
  setTimeout(()=>g.remove(),14000)
}
// 生成星光
function createStar(){
  const s = document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay = Math.random()*3+"s";
  document.body.appendChild(s);
}
// 定时生成
setInterval(createGhost, 2200);
for(let i=0;i<35;i++) createStar();
</script>
</body>
</html>
